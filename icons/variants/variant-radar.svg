<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="igBg" x1="10%" y1="95%" x2="90%" y2="5%">
      <stop offset="0%" stop-color="#FFDC80"/>
      <stop offset="22%" stop-color="#F77737"/>
      <stop offset="42%" stop-color="#F56040"/>
      <stop offset="55%" stop-color="#E1306C"/>
      <stop offset="72%" stop-color="#C13584"/>
      <stop offset="88%" stop-color="#833AB4"/>
      <stop offset="100%" stop-color="#405DE6"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#igBg)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.5"/>

  <!-- Center White Camera Outline -->
  <g filter="url(#softGlow)">
    <rect x="116" y="116" width="280" height="280" rx="72" ry="72" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/>
    <!-- Flash dot -->
    <circle cx="334" cy="178" r="16" fill="#FFFFFF"/>

    <!-- Radar / Target Crosshair Reticle Lens -->
    <circle cx="256" cy="256" r="68" fill="none" stroke="#FFFFFF" stroke-width="22"/>
    <!-- Center radar dot -->
    <circle cx="256" cy="256" r="22" fill="#FFFFFF"/>
    
    <!-- Reticle Cross Ticks (extending outside lens) -->
    <path d="M 256 160 L 256 174 M 256 338 L 256 352 M 160 256 L 174 256 M 338 256 L 352 256" 
          stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>