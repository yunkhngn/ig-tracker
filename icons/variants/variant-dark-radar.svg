<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="igNeon" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#FFDD55"/>
      <stop offset="25%" stop-color="#FF543E"/>
      <stop offset="50%" stop-color="#D62976"/>
      <stop offset="75%" stop-color="#962FBF"/>
      <stop offset="100%" stop-color="#4F5BD5"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151824"/>
      <stop offset="100%" stop-color="#080A10"/>
    </linearGradient>
  </defs>

  <!-- Dark Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgDark)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Camera Outer Frame -->
  <rect x="116" y="116" width="280" height="280" rx="72" ry="72" fill="none" stroke="url(#igNeon)" stroke-width="26" stroke-linecap="round"/>

  <!-- Flash Dot -->
  <circle cx="334" cy="178" r="16" fill="url(#igNeon)"/>

  <!-- Tracking Radar Reticle Lens -->
  <circle cx="256" cy="256" r="68" fill="none" stroke="url(#igNeon)" stroke-width="22"/>
  <circle cx="256" cy="256" r="22" fill="url(#igNeon)"/>

  <!-- Precision ticks -->
  <path d="M 256 160 L 256 174 M 256 338 L 256 352 M 160 256 L 174 256 M 338 256 L 352 256" 
        stroke="url(#igNeon)" stroke-width="12" stroke-linecap="round"/>
</svg>